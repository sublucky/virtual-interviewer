# 后端工程师种子语料（需求 v0.4 §4.1 语料初始化）
defaults:
  kind: question
  role: 后端工程师
  source: import
  status: active

entries:
  - id: seed-be-mysql-index
    tags: [MySQL, 索引, 性能]
    content: 一张 2000 万行的订单表，按 user_id + created_at 查最近订单越来越慢，你会怎么定位和优化？
    rubric: |
      及格：能想到看执行计划、加联合索引；
      优秀：说清联合索引最左前缀与顺序选择、覆盖索引避免回表、深分页问题、以及归档/分区等容量手段。
    reference_answer: |
      1) EXPLAIN 看是否走索引、扫描行数；2) 建 (user_id, created_at) 联合索引，注意顺序；
      3) 用覆盖索引减少回表；4) 深分页改为 seek 方式；5) 冷数据归档或分区。

  - id: seed-be-cache-consistency
    tags: [Redis, 缓存, 一致性]
    content: 缓存和数据库如何保证一致性？你在项目里用的是哪种策略，代价是什么？
    rubric: |
      及格：知道 Cache Aside、先写库再删缓存；
      优秀：能讲清删缓存失败的补偿（消息队列/binlog）、并发读写下的脏数据窗口、延迟双删的局限。
    reference_answer: |
      主流 Cache Aside：读时回填，写时先落库再删缓存；删除失败靠重试或订阅 binlog 补偿；
      强一致场景要么加锁要么直接读库，不要指望缓存做强一致。

  - id: seed-be-idempotent
    tags: [分布式, 幂等, 支付]
    content: 支付回调可能重复投递，你怎么保证下游只处理一次？
    rubric: |
      及格：提到唯一键或去重表；
      优秀：区分幂等键设计、状态机约束、并发下的唯一索引冲突处理、以及重试与补偿的边界。
    reference_answer: |
      以业务单号做幂等键 + 唯一索引；处理前先查状态，用状态机限制非法流转；
      并发靠数据库唯一约束兜底而非应用层判断。

  - id: seed-be-timeout
    tags: [微服务, 超时, 稳定性]
    content: 一个接口依赖三个下游服务，其中一个偶发变慢导致整体雪崩，你会怎么改造？
    rubric: |
      及格：提到超时和重试；
      优秀：讲清超时预算分配、熔断降级、隔离（线程池/信号量）、重试放大风险与退避策略。
    reference_answer: |
      为每个下游设独立超时并做总预算约束；加熔断与降级返回；用舱壁隔离避免资源被单个依赖占满；
      重试要限次 + 指数退避 + 幂等前提。

  - id: seed-be-mq
    tags: [消息队列, 顺序, 可靠性]
    content: 用消息队列做异步解耦时，怎么同时兼顾顺序性和吞吐？
    rubric: |
      及格：知道分区/队列内有序；
      优秀：能按业务键做分区路由、说明消费失败重试对顺序的破坏、以及死信队列的处理方式。
    reference_answer: |
      同一业务键路由到同一分区保证局部有序；全局有序要牺牲并发；
      失败消息进死信队列单独处理，避免阻塞整个分区。

  - id: seed-be-transaction
    tags: [事务, 分布式, 一致性]
    content: 下单要扣库存、写订单、发积分，跨多个服务时你会怎么保证最终一致？
    rubric: |
      及格：提到本地事务或事务消息；
      优秀：能对比 TCC / Saga / 本地消息表 / Outbox 的取舍，并说清失败补偿与对账。
    reference_answer: |
      优先业务可接受最终一致：本地消息表或 Outbox + MQ；需要强一致再上 TCC；
      必须有补偿与定时对账兜底。

  - id: seed-be-rate-limit
    tags: [限流, 高并发, 网关]
    content: 活动开始瞬间 QPS 打到平时 20 倍，你会在哪几层做限流，依据是什么？
    rubric: |
      及格：知道网关限流；
      优秀：能分层（入口/服务/资源）、区分用户维度与接口维度，并说明令牌桶/漏桶与降级策略。
    reference_answer: |
      网关按接口与用户维度限流；热点接口单独配额；后端对 DB/缓存再加保护；
      超限快速失败或返回排队页，避免拖垮核心链路。

  - id: seed-be-observability
    tags: [可观测, 排障, 工程]
    content: 线上接口 P99 突然从 80ms 涨到 800ms，你会按什么顺序排查？
    rubric: |
      及格：看监控与日志；
      优秀：有清晰路径：变更窗口 → 黄金指标 → 依赖/DB/GC → 采样 trace → 回滚或止血。
    reference_answer: |
      先确认是否发布/配置变更；看错误率与饱和度；对比依赖与慢查询；
      用 trace 定位耗时段；能止血先回滚或限流。

  - id: seed-be-rubric-general
    kind: rubric
    tags: [评分标准, 通用]
    content: 后端候选人通用评分维度与档位定义。
    rubric: |
      技术深度：只会用法=2；懂原理=3；能讲清取舍与边界=4；有量化验证与踩坑经历=5。
      工程实践：无=2；有规范意识=3；主动改造过流程=4；推动团队落地=5。
      问题解决：等人给方案=2；能按套路排查=3；有系统性方法论=4；能定位到根因并防复发=5。
      沟通表达：需反复追问=2；结构基本清晰=3；STAR 完整=4；能主动澄清边界=5。

  - id: seed-be-knowledge-cap
    kind: knowledge
    tags: [容量规划, 面经]
    content: |
      后端容量追问要点：先让候选人给出 QPS、峰值倍数、数据量与 SLA；
      再追「瓶颈在 CPU/IO/锁/网络哪一类」和「扩容后是否线性」。
      优秀回答会主动谈容量模型与压测证据，而不是只说「加机器」。
