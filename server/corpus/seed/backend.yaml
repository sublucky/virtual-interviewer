# 后端工程师种子语料（MVP 冷启动用，需求 v0.4 §4.1 语料初始化）
defaults:
  kind: question
  role: 后端工程师
  source: import
  status: active

entries:
  - id: seed-be-mysql-index
    tags: [MySQL, 索引, 性能]
    content: 一张 2000 万行的订单表，按 user_id + created_at 查最近订单越来越慢，你会怎么定位和优化？
    rubric: |
      及格：能想到看执行计划、加联合索引；
      优秀：说清联合索引最左前缀与顺序选择、覆盖索引避免回表、深分页问题、以及归档/分区等容量手段。
    reference_answer: |
      1) EXPLAIN 看是否走索引、扫描行数；2) 建 (user_id, created_at) 联合索引，注意顺序；
      3) 用覆盖索引减少回表；4) 深分页改为 seek 方式；5) 冷数据归档或分区。

  - id: seed-be-cache-consistency
    tags: [Redis, 缓存, 一致性]
    content: 缓存和数据库如何保证一致性？你在项目里用的是哪种策略，代价是什么？
    rubric: |
      及格：知道 Cache Aside、先写库再删缓存；
      优秀：能讲清删缓存失败的补偿（消息队列/binlog）、并发读写下的脏数据窗口、延迟双删的局限。
    reference_answer: |
      主流 Cache Aside：读时回填，写时先落库再删缓存；删除失败靠重试或订阅 binlog 补偿；
      强一致场景要么加锁要么直接读库，不要指望缓存做强一致。

  - id: seed-be-idempotent
    tags: [分布式, 幂等, 支付]
    content: 支付回调可能重复投递，你怎么保证下游只处理一次？
    rubric: |
      及格：提到唯一键或去重表；
      优秀：区分幂等键设计、状态机约束、并发下的唯一索引冲突处理、以及重试与补偿的边界。
    reference_answer: |
      以业务单号做幂等键 + 唯一索引；处理前先查状态，用状态机限制非法流转；
      并发靠数据库唯一约束兜底而非应用层判断。

  - id: seed-be-timeout
    tags: [微服务, 超时, 稳定性]
    content: 一个接口依赖三个下游服务，其中一个偶发变慢导致整体雪崩，你会怎么改造？
    rubric: |
      及格：提到超时和重试；
      优秀：讲清超时预算分配、熔断降级、隔离（线程池/信号量）、重试放大风险与退避策略。
    reference_answer: |
      为每个下游设独立超时并做总预算约束；加熔断与降级返回；用舱壁隔离避免资源被单个依赖占满；
      重试要限次 + 指数退避 + 幂等前提。

  - id: seed-be-mq
    tags: [消息队列, 顺序, 可靠性]
    content: 用消息队列做异步解耦时，怎么同时兼顾顺序性和吞吐？
    rubric: |
      及格：知道分区/队列内有序；
      优秀：能按业务键做分区路由、说明消费失败重试对顺序的破坏、以及死信队列的处理方式。
    reference_answer: |
      同一业务键路由到同一分区保证局部有序；全局有序要牺牲并发；
      失败消息进死信队列单独处理，避免阻塞整个分区。

  - id: seed-be-rubric-general
    kind: rubric
    tags: [评分标准, 通用]
    content: 后端候选人通用评分维度与档位定义。
    rubric: |
      技术深度：只会用法=2；懂原理=3；能讲清取舍与边界=4；有量化验证与踩坑经历=5。
      工程实践：无=2；有规范意识=3；主动改造过流程=4；推动团队落地=5。
      问题解决：等人给方案=2；能按套路排查=3；有系统性方法论=4；能定位到根因并防复发=5。
      沟通表达：需反复追问=2；结构基本清晰=3；STAR 完整=4；能主动澄清边界=5。
