# 产品经理种子语料
defaults:
  kind: question
  role: 产品经理
  source: import
  status: active

entries:
  - id: seed-pm-priority
    tags: [优先级, 决策, 协作]
    content: 同时有三个需求：老板点名、大客户投诉、数据表明可提升留存，你如何排期并说服各方？
    rubric: |
      及格：能列出利弊；
      优秀：有明确框架（影响/成本/风险/时效），并能给出沟通策略与可验证结果。
    reference_answer: |
      量化影响与紧急度；拆最小可验证方案；对老板给时间盒，对客户给止血，对增长做实验。

  - id: seed-pm-metric
    tags: [指标, 增长, 分析]
    content: 新功能上线一周，日活没变但投诉上升，你会怎么分析下一步？
    rubric: |
      及格：看数据和反馈；
      优秀：能拆分漏斗、人群、版本，提出假设并设计验证，同时安排止血。
    reference_answer: |
      分人群与路径看转化；对照发布变更；先修高伤体验；再用实验验证假设。

  - id: seed-pm-tradeoff
    tags: [取舍, B端, 体验]
    content: 研发说要两周做完整方案，业务只要三天出一个能演示的版本，你怎么定范围？
    rubric: |
      及格：砍功能；
      优秀：能定义 MVP 成功标准、非目标、风险清单，并约定后续补齐路径。
    reference_answer: |
      明确演示要验证的假设；砍掉非验证路径；写下技术债与补齐计划；对齐验收口径。

  - id: seed-pm-user
    tags: [用户研究, 需求]
    content: 用户说「我要一个按钮」，你怎么判断这是不是真需求？
    rubric: |
      及格：继续问为什么；
      优秀：能回到任务与场景，区分方案与问题，并用数据或访谈验证。
    reference_answer: |
      追问场景、频率、现有替代；观察真实行为；把「要按钮」还原成要完成的任务。

  - id: seed-pm-failure
    tags: [复盘, 项目]
    content: 讲一个你推动失败或效果不及预期的项目，根因是什么，后来改了什么？
    rubric: |
      及格：能复盘事实；
      优秀：定位到决策/信息/组织问题，并有机制性改进而非个人归因。
    reference_answer: |
      STAR 讲清目标与结果落差；根因落到假设错误或协作断层；后续固化评审或指标门槛。

  - id: seed-pm-rubric
    kind: rubric
    tags: [评分标准]
    content: 产品经理评分维度与档位定义。
    rubric: |
      结构化思维：叙述混乱=2；能拆问题=3；有决策框架=4；能在不确定下推进=5。
      数据意识：凭感觉=2；会看基础数据=3；会设计指标与实验=4；能驱动业务结果=5。
      协同推动：执行指令=2；能对齐目标=3；能处理冲突=4；能影响无汇报线角色=5。

  - id: seed-pm-knowledge-case
    kind: knowledge
    tags: [案例, 面经]
    content: |
      产品面追问策略：先要目标与用户 → 再要方案取舍 → 再要指标与复盘。
      候选人只讲功能清单时，追「不做会怎样」和「如何证明做成了」。
