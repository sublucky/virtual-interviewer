# Qwen3-Omni 2× A100 40GB：Thinker 跨两卡 TP=2，Talker 在 GPU1，Code2Wav 在 GPU0。
# 单卡 40GB 装不下 BF16 Thinker（约 59GB）；两卡切分后每卡约 30GB 权重。
async_chunk: false

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      initial_codec_chunk_frames: 4
      codec_chunk_frames: 25
      codec_left_context_frames: 25

stages:
  - stage_id: 0
    devices: "0,1"
    tensor_parallel_size: 2
    gpu_memory_utilization: 0.90
    max_model_len: 2048
    max_num_seqs: 1
    max_num_batched_tokens: 2048
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    default_sampling_params:
      temperature: 0.0
      max_tokens: 1024

  - stage_id: 1
    # 分进程启动时 CUDA_VISIBLE_DEVICES=1，逻辑编号为 0
    devices: "0"
    gpu_memory_utilization: 0.12
    max_model_len: 4096
    max_num_seqs: 1
    max_num_batched_tokens: 4096
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.9
      top_k: 50
      max_tokens: 2048
      repetition_penalty: 1.05

  - stage_id: 2
    # 分进程时 CUDA_VISIBLE_DEVICES=0，与 Talker 错开
    devices: "0"
    gpu_memory_utilization: 0.08
    max_model_len: 8192
    max_num_seqs: 1
    max_num_batched_tokens: 8192
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    enable_chunked_prefill: false
    async_scheduling: false
    input_connectors:
      from_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 8192
      repetition_penalty: 1.1
